<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Samjo — Samajh aane tak.</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Resolve the theme before first paint so a dark-mode reader never sees a
         white flash. Mirrors readStoredMode() in src/theme/theme.tsx. */
      (function () {
        try {
          var m = localStorage.getItem('samjo.theme');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = m;
          document.documentElement.style.colorScheme = m;
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
